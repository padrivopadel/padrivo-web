name: BASE-01 validation
on:
  push:
    branches: [chore/base-01-stabilization]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: base01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify local dependency resolution
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import path from 'node:path';
          const require = createRequire(import.meta.url);
          const root = path.join(process.cwd(), 'node_modules') + path.sep;
          for (const name of ['next', 'eslint', 'tailwindcss', '@tailwindcss/postcss']) {
            const resolved = require.resolve(name);
            if (!resolved.startsWith(root)) throw new Error(`${name} resolves outside workspace`);
            console.log(`${name}: ${resolved}`);
          }
          NODE
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
